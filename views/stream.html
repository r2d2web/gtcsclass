<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="theme-color" content="#c8102e">
<title>Stream · Classroom</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="app"><header class="top" id="nav"></header><main id="main"></main></div>
<script src="/js/app.js"></script>

<script>
(async () => {
  const me = await shell('/stream');
  const main = document.getElementById('main');
  const list = h('div');
  const MAX_FILES = 5, MAX_BYTES = 5 * 1024 * 1024;
  const KINDS = {
    pdf: { label: 'PDF', accept: '.pdf' },
    sheet: { label: 'spreadsheet', accept: '.xls,.xlsx,.csv' },
    image: { label: 'image', accept: '.png,.jpg,.jpeg,.gif,.webp' },
    doc: { label: 'document', accept: '.doc,.docx,.ppt,.pptx,.txt,.zip' },
  };
  const size = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
  const toBase64 = (file) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1] || '');
    r.onerror = () => reject(new Error('Could not read ' + file.name));
    r.readAsDataURL(file);
  });
  main.append(h('h1', {}, 'Stream'), h('p', { class: 'lede' }, 'Announcements from your teacher'));

  if (me.role === 'teacher') {
    let files = [];
    const box = h('textarea', { rows: 3, placeholder: 'Share an update with the class', 'aria-label': 'New announcement' });
    const picker = h('input', { type: 'file', multiple: 'multiple', hidden: 'hidden', tabindex: '-1', 'aria-hidden': 'true' });
    const chips = h('div', { class: 'fchips' });
    const paint = () => chips.replaceChildren(...files.map((f, i) => h('span', { class: 'fchip' }, `${f.name} · ${size(f.size)}`,
      h('button', { type: 'button', 'aria-label': 'Remove ' + f.name, onclick: () => { files.splice(i, 1); paint(); } }, '×'))));
    picker.addEventListener('change', () => {
      for (const f of picker.files) {
        if (files.some((x) => x.name === f.name && x.size === f.size)) continue;
        if (f.size > MAX_BYTES) { toast(`${f.name} is larger than 5 MB.`, true); continue; }
        if (files.length >= MAX_FILES) { toast(`You can attach up to ${MAX_FILES} files.`, true); break; }
        files.push(f);
      }
      picker.value = '';
      paint();
    });
    const tiles = h('div', { class: 'tiles' }, Object.entries(KINDS).map(([k, v]) => {
      const b = h('button', { type: 'button', class: 'ftile', title: 'Attach a ' + v.label, 'aria-label': 'Attach a ' + v.label,
        onclick: () => { picker.accept = v.accept; picker.click(); } });
      b.append(icon(k));
      return b;
    }));
    const post = h('button', { class: 'btn', onclick: async () => {
      post.disabled = true; post.textContent = files.length ? 'Uploading…' : 'Posting…';
      try {
        const attachments = await Promise.all(files.map(async (f) => ({ name: f.name, data: await toBase64(f) })));
        await api('/api/stream', { method: 'POST', body: { text: box.value, attachments } });
        box.value = ''; files = []; paint(); toast('Posted'); load();
      } catch (e) { toast(e.message, true); }
      post.disabled = false; post.textContent = 'Post announcement';
    } }, 'Post announcement');
    main.append(h('div', { class: 'card' }, box,
      h('label', { style: 'margin-top:.9rem' }, 'Attach files'), tiles, picker, chips,
      h('div', { class: 'meta', style: 'margin:.4rem 0 0' }, `Optional: up to ${MAX_FILES} files, 5 MB each (images, PDF, Office files, text, zip).`),
      h('div', { class: 'row end', style: 'margin-top:.8rem' }, post)));
  }
  main.append(list);

  function attachments(a) {
    if (!a.attachments || !a.attachments.length) return null;
    return h('div', { class: 'attach' }, a.attachments.map((f) => {
      const url = '/api/stream/files/' + f.id;
      return f.isImage
        ? h('a', { href: url, target: '_blank', rel: 'noopener' }, h('img', { src: url, alt: f.name, loading: 'lazy' }))
        : h('a', { class: 'file', href: url, download: f.name }, f.name, h('small', {}, size(f.size)));
    }));
  }

  function postCard(a) {
    let liked = a.liked, likes = a.likeCount, count = a.commentCount, loaded = false;
    const likeLabel = h('span'), commentLabel = h('span');
    const paint = () => {
      likeBtn.classList.toggle('on', liked); likeBtn.setAttribute('aria-pressed', String(liked));
      likeLabel.textContent = 'Like' + (likes ? ` (${likes})` : '');
      commentLabel.textContent = 'Comment' + (count ? ` (${count})` : '');
    };
    const likeBtn = h('button', { class: 'act', type: 'button', onclick: async () => {
      try { const r = await api(`/api/stream/${a.id}/like`, { method: 'POST' }); liked = r.liked; likes = r.likeCount; paint(); }
      catch (e) { toast(e.message, true); }
    } }, icon('thumb'), likeLabel);

    const listEl = h('div');
    const input = h('input', { placeholder: 'Write a comment', maxlength: 1000, 'aria-label': 'Write a comment', autocomplete: 'off' });
    const send = h('button', { class: 'btn small', type: 'button', onclick: async () => {
      const text = input.value.trim();
      if (!text) return;
      try {
        const c = await api(`/api/stream/${a.id}/comments`, { method: 'POST', body: { text } });
        input.value = ''; listEl.append(commentRow(c)); count++; paint();
      } catch (e) { toast(e.message, true); }
    } }, 'Send');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send.click(); } });
    const panel = h('div', { class: 'comments', hidden: 'hidden' }, listEl, h('div', { class: 'cform' }, input, send));

    function commentRow(c) {
      const row = h('div', { class: 'comment' }, avatar({ name: c.authorName, avatarUrl: c.avatarUrl }, 'sm'),
        h('div', { class: 'c-body' },
          h('div', { class: 'c-meta' }, h('strong', {}, c.authorName), c.authorRole === 'teacher' && h('span', { class: 'chip' }, 'Teacher'),
            h('span', {}, fmtShort(c.createdAt)),
            (c.mine || me.role === 'teacher') && h('button', { class: 'link', type: 'button', onclick: async () => {
              try { await api(`/api/stream/${a.id}/comments/${c.id}`, { method: 'DELETE' }); row.remove(); count--; paint(); }
              catch (e) { toast(e.message, true); }
            } }, 'Delete')),
          h('div', { class: 'body' }, c.text)));
      return row;
    }

    const commentBtn = h('button', { class: 'act', type: 'button', onclick: async () => {
      panel.hidden = !panel.hidden;
      if (!panel.hidden && !loaded) {
        try { (await api(`/api/stream/${a.id}/comments`)).forEach((c) => listEl.append(commentRow(c))); loaded = true; }
        catch (e) { toast(e.message, true); }
      }
      if (!panel.hidden) input.focus();
    } }, icon('comment'), commentLabel);
    paint();

    return h('article', { class: 'card' },
      h('div', { class: 'post-head' }, avatar({ name: a.authorName, avatarUrl: a.authorAvatar }, ''),
        h('div', { class: 'who2' }, h('strong', {}, a.authorName), h('small', {}, 'Teacher')),
        h('time', { datetime: a.createdAt, title: fmtDate(a.createdAt) }, fmtShort(a.createdAt))),
      a.text && h('div', { class: 'body' }, a.text),
      attachments(a),
      h('div', { class: 'post-actions' }, likeBtn, commentBtn, h('span', { class: 'spacer' }),
        me.role === 'teacher' && h('button', { class: 'link danger', type: 'button', onclick: async () => {
          if (!confirm('Delete this announcement' + (a.attachments && a.attachments.length ? ' and its files?' : '?'))) return;
          await api('/api/stream/' + a.id, { method: 'DELETE' }); toast('Deleted'); load();
        } }, 'Delete')),
      panel);
  }

  async function load() {
    const items = await api('/api/stream');
    list.replaceChildren(...(items.length ? items.map(postCard)
      : [h('div', { class: 'empty' }, me.role === 'teacher' ? 'No announcements yet. Post the first one above.' : 'No announcements yet. Check back soon.')]));
  }
  load();
})();
</script>
</body></html>
