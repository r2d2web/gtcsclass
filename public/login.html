<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="theme-color" content="#c8102e">
<title>Sign in · Classroom</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="login">
  <section class="hero">
    <div class="mark"><span class="logo-tile lg"><img src="/logo.png" alt="" onerror="this.parentNode.hidden=true"></span>Classroom</div>
    <h1>Everything for class, in one place.</h1>
    <p>Read announcements, hand in work, and talk with your class.</p>
  </section>
  <section class="panel">
    <h2 style="font-size:1.6rem">Sign in</h2>
    <p class="lede" style="margin-bottom:.5rem">Use the username and password your teacher gave you.</p>
    <form id="form" novalidate>
      <label for="username">Username</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button class="btn" id="submit" style="margin-top:.5rem">Sign in</button>
    </form>
  </section>
</div>
<script src="/js/app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('error').textContent = '';
  $('submit').disabled = true;
  try {
    await api('/api/auth/login', { method: 'POST', body: { username: $('username').value, password: $('password').value } });
    location.href = '/stream';
  } catch (err) { $('error').textContent = err.message; $('submit').disabled = false; }
});
</script>
</body></html>
